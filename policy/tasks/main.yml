---
# tasks file for policy
  - name: Create IAM Managed Policy
    amazon.aws.iam_managed_policy:
      policy_name: "MyEC2ReadPolicy"
      policy_description: "A policy that allows the user to read information about the AWS Ec2 instances"
      policy: "{{ lookup('file','MyEC2ReadPolicy.json') }}"
      state: present
    register: policy


  - name: Attach policy to IAM user
    amazon.aws.iam_user:
      name: "Your_User
      managed_policies:
        - "{{ policy.policy.arn }}"
      state: present
